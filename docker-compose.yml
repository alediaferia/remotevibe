# Default deployment. Put this checkout somewhere like /opt/remotevibe, create
# .env next to it, then either:
#
#   docker compose pull && docker compose up -d   # pull CI-built images (prod)
#
# or, to build locally instead of pulling:
#
#   docker compose --profile build build agent   # the session container image
#   docker compose up -d --build                 # the control plane
#
services:
  remotevibed:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ${RV_DAEMON_IMAGE:-ghcr.io/alediaferia/remotevibe-daemon:latest}
    container_name: remotevibed
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container the daemon must listen on all interfaces; the port
      # below is published to loopback only, so the tailnet is still the only
      # way in. Any RV_ADDR in .env is intentionally overridden here.
      RV_ADDR: 0.0.0.0:8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Sibling containers, not nested ones: the daemon asks the host's Docker
      # to run them.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the SAME path inside and out. The daemon passes this path to
      # the host Docker when it seeds a session's credentials, and the host
      # resolves it on the host filesystem — a different path inside would
      # silently seed sessions from nothing and land them on a login prompt.
      - ${RV_STATE_DIR:?set RV_STATE_DIR in .env}:${RV_STATE_DIR:?}

  # Build-only: the session container image. It is never "up" — sessions are
  # started by the daemon, one container per repository.
  agent:
    profiles: ["build"]
    build: ./image
    image: ${RV_AGENT_IMAGE:-ghcr.io/alediaferia/remotevibe-agent:latest}
