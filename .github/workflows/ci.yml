name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: gofmt -l ./cmd ./internal ./web | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t remotevibe/agent:ci image

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh deploy/install.sh image/entrypoint.sh image/agent-health.sh

  # Publishes both images to GHCR so a deploy is `docker compose pull` — no Go
  # toolchain or build step on the VPS. Only runs once go/image/shell are
  # green, and only for pushes to main (PRs just prove the images still build).
  publish:
    needs: [go, image, shell]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/remotevibe-daemon:latest
            ghcr.io/${{ github.repository_owner }}/remotevibe-daemon:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/remotevibe-agent:latest
            ghcr.io/${{ github.repository_owner }}/remotevibe-agent:${{ github.sha }}
